name: ci

# Build, verify generated code, test, and lint main and release-branch pull requests.
on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    name: lint-go-${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: api
            directory: .
            target: lint-go-full
          - module: controller
            directory: controller
            target: lint
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: '${{ matrix.directory }}/go.mod'
          cache-dependency-path: '**/go.sum'
      - name: Lint Go
        working-directory: ${{ matrix.directory }}
        run: make ${{ matrix.target }}

  verify-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Verify generated code
        run: make verify

  build:
    name: build-${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: api
            directory: .
            target: build
          - module: controller
            directory: controller
            target: manager
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: '${{ matrix.directory }}/go.mod'
          cache-dependency-path: '**/go.sum'
      - name: Build
        working-directory: ${{ matrix.directory }}
        run: make ${{ matrix.target }}

  test:
    name: test-${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: api
            directory: .
            target: test
          - module: controller
            directory: controller
            target: test
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: '${{ matrix.directory }}/go.mod'
          cache-dependency-path: '**/go.sum'
      - name: Test
        working-directory: ${{ matrix.directory }}
        run: make ${{ matrix.target }}

  smoke-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Test CRD and VM API on kind
        run: make test-smoke
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kind-smoke-logs
          path: _artifacts/kind-smoke/
          if-no-files-found: ignore
          retention-days: 7

  lint-markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Markdown linter
        run: npm install --global markdownlint-cli@0.44.0
      - name: Lint Markdown
        run: make lint-markdown MDLINT='markdownlint "**/*.md"'

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install typo checker
        env:
          TYPOS_VERSION: '1.40.0'
          TYPOS_SHA256: '485405d0a92871f45ead0703d23c04ae6969ad4a6e5799794f55eb04b9f07801'
        run: |
          mkdir -p "$RUNNER_TEMP/typos"
          curl --fail --location --retry 3 \
            "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$RUNNER_TEMP/typos.tar.gz"
          echo "$TYPOS_SHA256  $RUNNER_TEMP/typos.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/typos"
          echo "$RUNNER_TEMP/typos" >> "$GITHUB_PATH"
      - name: Check for typos
        run: make typos TYPOS=typos
