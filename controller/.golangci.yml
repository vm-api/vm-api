version: "2"

run:
  timeout: 5m

formatters:
  enable:
  - gofmt
  - goimports
  settings:
    goimports:
      local-prefixes:
      - github.com/vm-api/vm-api

linters:
  enable:
  - asciicheck
  - bodyclose
  - errcheck
  - errorlint
  - govet
  - ineffassign
  - misspell
  - nakedret
  - nolintlint
  - prealloc
  - revive
  - staticcheck
  - unconvert
  - unparam
  - unused
  - whitespace

  settings:
    revive:
      rules:
      - name: exported
        disabled: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
