version: "2"

run:
  timeout: 5m

formatters:
  enable:
  - gofmt
  - goimports
  settings:
    goimports:
      # Put project imports after third-party packages.
      local-prefixes:
      - github.com/vm-api/vm-api

linters:
  enable:
  - asciicheck
  - bodyclose
  - errcheck
  - errorlint
  - govet
  - ineffassign
  - misspell
  - nakedret
  - nolintlint
  - prealloc
  - revive
  - staticcheck
  - unconvert
  - unparam
  - unused
  - whitespace

  settings:
    revive:
      rules:
      # API type and constant names are self-documenting in aggregate; the
      # package-level doc comment carries the context. Individual exported
      # constants in an enum block do not each need their own comment.
      - name: exported
        disabled: true

  exclusions:
    generated: lax
    rules:
    # Generated deepcopy code is not ours to lint.
    - path: zz_generated\..*\.go
      linters:
      - all

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
